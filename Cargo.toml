[package]
name = "troupe-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.0", features = ["derive"] }
dashmap = "6.1.0"
futures = "0.3.32"
logos = "0.16.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.3", features = ["full"] }
uuid = { version = "1.23.1", features = ["v4"] }

[[test]]
name = "ifc"
harness = false

[[test]]
name = "runtime"
harness = false

[dev-dependencies]
datatest-stable = "0.3.3"
insta = "1.47.2"
